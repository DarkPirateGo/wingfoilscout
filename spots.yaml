  notes: "Nordostwind kommt noch am konstantesten, denn Wind aus dieser Richtung kann sich über der gesamten Länge des Silbersees noch stabilisieren - aber wann hat man schon mal Nordost-Wind ? Westliche Winde wiederum wehen ablandig am Spot, ermöglichen aber dafür die längsten Schläge auf dem See, wenn man das mühsame Höhelaufen in Kauf nimmt. Bei westlichen bis nördlichen Winden lohnt auch der Weg auf die Landzunge, hierfür benötigt Ihr allerdings unbedingt einen Surfwagen, da dieser Bereich nicht mit dem Auto befahren werden darf. Dafür kommt hier der Wind deutlich konstanter und stabiler."

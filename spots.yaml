# ─────────────────────────────────────────────────────────────────────────────
#  Wingfoilscout · Spot catalogue
#
#  Origin of the entries:
#   · Windfinder spot pages (community-driven, `popularity` = rank by
#     visits there) — coordinate documented, source in `source`
#   · Google Maps list "Wingfoil Spots" by Jens Dee, 213 places
#     https://maps.app.goo.gl/5QM64ZbUbmcit8rf6 — placed pins with an exact
#     coordinate, but without names and without known wind directions
#   · my own estimates (`verified: false`) — please check them via the map link
#
#  `geo_ok: true` means: the shoreline geometry looked suspicious, someone checked
#  it on the map and found it to be correct. Set by the check page
#  (“Check coordinates” under Data sources); the spot then no longer appears
#  in the list of findings.
#
#  `sectors_unknown: true` means: the coordinate is right, but the usable wind
#  directions are missing. Such spots are ranked with a neutral direction score and
#  marked in the report. As soon as you enter sectors, the marker disappears.
#
#  sectors.from/.to = direction the wind COMES FROM (degrees, 0 = north),
#                     may wrap around north (from: 320, to: 40)
#  quality          = best | good | ok | bad
#  water            = flat | chop | wave
#  shallow          = none | inshore | widespread
#  seagrass         = none | some | heavy
# ─────────────────────────────────────────────────────────────────────────────
#
#  New fields (revision of 5 Sep):
#  wind_factor  1.0 = take the model as it is; 1.15 = "the spot always delivers more
#               than Windguru says" — your calibration knob per spot
#  thermal      empirical values for thermal spots (Ora, Breva, Maloja): months,
#               time window, direction, typical strength, reliability 0–1
#  tidal        true = the tide applies here (times in the report), false = never;
#               leave out = automatic for sea/lagoon from 0.5 m range (1.18.0)
#  tide         tide window, makes the tide a rule (1.18.0):
#                 fahrbar: hochwasser | niedrigwasser | auflaufend | ablaufend
#                 stunden: 2   (± around high/low tide, only with hochwasser/niedrigwasser)
#               Hours outside are dropped with a veto. Without the block, display only.
#  region       area name for weather warnings (MeteoAlarm), e.g. "Zeeland"

